<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Thanh Toán - CELLVANY</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://cellvany.vn/checkout.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
    }

    header {
      background: #fff;
      padding: 15px 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }

    .logo img {
      height: 60px;
      width: auto;
      object-fit: contain;
      display: block;
      margin-bottom: -5px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: bold;
      color: #27ae60;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: #333;
    }

    .header-icons {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .header-icons button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .buy-now-btn {
      background: #229954;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }

    .checkout-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 40px;
    }

    .checkout-form h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .form-section {
      margin-bottom: 30px;
    }

    .form-section h3 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
      border-bottom: 2px solid #27ae60;
      padding-bottom: 8px;
    }

    .form-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-template-columns: 1fr;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    /* Chỉ áp width:100% cho input text/email/tel..., KHÔNG áp cho radio/checkbox
       (đây là nguyên nhân khiến 2 nút chọn phương thức thanh toán bị giãn cách xa chữ) */
    .form-group input:not([type="radio"]):not([type="checkbox"]),
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group input:not([type="radio"]):not([type="checkbox"]):focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #27ae60;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Hàng chọn phương thức thanh toán: radio + chữ luôn sát nhau */
    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .payment-option:hover {
      border-color: #27ae60;
      background: #fafafa;
    }

    .payment-option input[type="radio"] {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      accent-color: #27ae60;
      cursor: pointer;
    }

    .order-summary {
      background: #fafafa;
      padding: 25px;
      border-radius: 8px;
      height: fit-content;
      position: sticky;
      top: 100px;
    }

    .order-summary h3 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .place-order-btn {
      width: 100%;
      background: #27ae60;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      margin-top: 20px;
      transition: background .2s, transform .1s;
    }

    .place-order-btn:hover {
      background: #229954;
    }

    .empty-checkout {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-checkout .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    footer {
      background: #1a1a1a;
      color: white;
      padding: 40px 20px;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
    }

    .footer-bottom {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #333;
      color: #999;
    }

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }

      .form-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Header injected by shared.js -->
  <div class="checkout-container">
    <div id="checkout-content"></div>
  </div>
  <!-- Footer injected by shared.js -->
  <script src="asset/js/shared.js"></script>
  <script>
    const CHECKOUT = (() => {
      function render() {
        const cart = CELLVANY.getCart();
        const container = document.getElementById('checkout-content');
        if (!cart.length) {
          container.innerHTML = '<div class="empty-checkout"><div class="icon">📦</div><h2>Giỏ Hàng Trống</h2><p>Hãy thêm sản phẩm trước khi thanh toán.</p><a href="shop.html" style="color:#27ae60">Tiếp Tục Mua Sắm</a></div>';
          return;
        }
        const items = cart.map(i => ({ ...i, product: CELLVANY.products.find(p => p.id === i.productId) })).filter(i => i.product);
        const subtotal = CELLVANY.cartTotal();
        const shipping = subtotal > 500000 ? 0 : 30000;
        const total = subtotal + shipping;
        container.innerHTML = `
          <form class="checkout-form" onsubmit="CHECKOUT.placeOrder(event)">
            <h2>Thông Tin Giao Hàng</h2>
            <div class="form-section">
              <div class="form-group">
                <div><label>Họ Tên *</label><input type="text" required placeholder="Nguyễn Văn A"></div>
                <div><label>Số Điện Thoại *</label><input type="tel" required placeholder="+84 xxx xxx xxx"></div>
              </div>
              <div class="form-group full"><label>Email</label><input type="email" placeholder="email@example.com"></div>
              <div class="form-group full"><label>Địa Chỉ *</label><input type="text" required placeholder="Số nhà, đường, phường/xã"></div>
              <div class="form-group">
                <div><label>Thành Phố *</label><input type="text" required placeholder="TP. Hồ Chí Minh"></div>
                <div><label>Ghi Chú</label><input type="text" placeholder="Ghi chú giao hàng (tùy chọn)"></div>
              </div>
            </div>
            <div class="form-section">
              <h3>Phương Thức Thanh Toán</h3>
              <div class="form-group full">
                <label class="payment-option"><input type="radio" name="payment" value="cod" checked> Thanh Toán Khi Nhận Hàng (COD)</label>
                <label class="payment-option"><input type="radio" name="payment" value="bank"> Chuyển Khoản Ngân Hàng</label>
              </div>
            </div>
            <button type="submit" class="place-order-btn">Đặt Hàng - ${total.toLocaleString('vi-VN')}đ</button>
          </form>
          <div class="order-summary">
            <h3>Đơn Hàng</h3>
            ${items.map(i => `<div class="summary-item"><span>${i.product.name} x${i.qty}</span><span>${(i.product.price * i.qty).toLocaleString("vi-VN")}đ</span></div>`).join("")}
            <div class="summary-item"><span>Phí Vận Chuyển</span><span>${shipping === 0 ? "Miễn Phí" : shipping.toLocaleString("vi-VN") + "đ"}</span></div>
            <div class="summary-total"><span>Tổng Cộng</span><span>${total.toLocaleString("vi-VN")}đ</span></div>
          </div>
        `;
      }
      function placeOrder(e) {
        e.preventDefault();
        alert('🎉 Đặt hàng thành công! Cảm ơn bạn đã mua sắm tại CELLVANY. Chúng tôi sẽ liên hệ sớm.');
        CELLVANY.saveCart([]);
        location.href = 'index.html';
      }
      async function init() {
        await CELLVANY.loadData();
        render();
      }
      return { init, placeOrder };
    })();
    document.addEventListener('DOMContentLoaded', CHECKOUT.init);
  </script>
</body>

</html>
