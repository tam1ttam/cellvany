<!DOCTYPE html>
<html lang="vi">

<head>
    <meta name="robots" content="noindex, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sản Phẩm - CELLVANY | Mỹ Phẩm Thuần Chay Cho Mẹ & Bé</title>
    <meta name="description"
        content="Khám phá bộ sưu tập mỹ phẩm thuần chay Cellvany: dầu gội bưởi năm roi, serum cám gạo, kem dưỡng... an toàn cho mẹ bầu và bé sơ sinh.">
    <meta name="keywords"
        content="mỹ phẩm thuần chay, dầu gội bưởi năm roi, serum cám gạo, chăm sóc da sau sinh, chăm sóc tóc sau sinh">
    <link rel="canonical" href="https://cellvany.id.vn/product.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Open Graph / Facebook (được set động theo sản phẩm) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cellvany.id.vn/product.html">
    <meta property="og:title" content="Sản Phẩm - CELLVANY | Mỹ Phẩm Thuần Chay Cho Mẹ & Bé">
    <meta property="og:description" content="Khám phá mỹ phẩm thuần chay Cellvany an toàn cho mẹ bầu và bé sơ sinh.">
    <meta property="og:image" content="https://cellvany.id.vn/asset/logo.png">
    <meta property="og:locale" content="vi_VN">

    <!-- Twitter (được set động theo sản phẩm) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://cellvany.id.vn/product.html">
    <meta name="twitter:title" content="Sản Phẩm - CELLVANY | Mỹ Phẩm Thuần Chay Cho Mẹ & Bé">
    <meta name="twitter:description" content="Khám phá mỹ phẩm thuần chay Cellvany an toàn cho mẹ bầu và bé sơ sinh.">
    <meta name="twitter:image" content="https://cellvany.id.vn/asset/logo.png">

    <!-- JSON-LD: BreadcrumbList (được set động) -->
    <script type="application/ld+json" id="breadcrumb-json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Trang chủ", "item": "https://cellvany.id.vn/" },
    { "@type": "ListItem", "position": 2, "name": "Cửa hàng", "item": "https://cellvany.id.vn/shop.html" },
    { "@type": "ListItem", "position": 3, "name": "Sản phẩm", "item": "https://cellvany.id.vn/product.html" }
  ]
}
</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
        }

        header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            text-align: center;
        }

        .logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-bottom: -5px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #333;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-icons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .buy-now-btn {
            background: #229954;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .breadcrumb {
            background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .breadcrumb h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .breadcrumb-nav {
            color: #999;
        }

        .breadcrumb-nav a {
            color: #27ae60;
            text-decoration: none;
        }

        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* Ảnh lớn ở trang chi tiết: scope riêng để KHÔNG ảnh hưởng
           tới ảnh thu nhỏ trong card "Sản phẩm tương tự" (đó là lý do
           chữ nhãn badge từng bị hiển thị siêu to ở phần liên quan) */
        .product-detail>.product-image {
            background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%);
            border-radius: 10px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .product-detail .product-info h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: justify;
        }

        .product-category {
            color: #27ae60;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-rating {
            color: #ffc107;
            margin-bottom: 15px;
        }

        .product-rating span {
            color: #999;
            font-size: 13px;
        }

        .product-price {
            font-size: 28px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .product-desc {
            color: #666;
            margin-bottom: 20px;
            text-align: justify;
            line-height: 1.8;
        }

        .product-ingredients {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .product-ingredients h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .product-ingredients p {
            color: #666;
            font-size: 14px;
            text-align: justify;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s, transform .15s;
        }

        .btn-primary {
            background: #333;
            color: white;
            flex: 1;
        }

        .btn-wishlist {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-wishlist.active {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        .btn-buy {
            background: #27ae60;
            color: white;
            flex: 1;
        }

        .no-product {
            text-align: center;
            padding: 80px 20px;
        }

        .related-title {
            font-size: 24px;
            margin: 60px 0 20px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        footer {
            background: #1a1a1a;
            color: white;
            padding: 40px 20px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #999;
        }

        @media (max-width: 480px) {
            .product-detail {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }

            .product-detail .product-info h1 {
                font-size: 22px;
            }

            .product-price {
                font-size: 22px;
            }

            .breadcrumb h1 {
                font-size: 28px;
            }

            .product-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="asset/logo.png">
</head>

<body> <!-- Header injected by shared.js -->
    <section class="breadcrumb">
        <h1>Sản Phẩm</h1>
        <div class="breadcrumb-nav"> <a href="index.html">Trang Chủ</a> &gt; <a href="shop.html">Cửa Hàng</a> &gt; <span
                id="breadcrumb-name">Đang tải...</span> </div>
    </section>
    <div class="product-container">
        <div id="product-detail"></div>
        <h2 class="related-title">Sản Phẩm Tương Tự</h2>
        <div class="related-grid" id="related-products"></div>
    </div> <!-- Footer injected by shared.js -->
    <script src="asset/js/shared.js?v=20260718"></script>
    <script>
        const PRODUCT = (() => {
            function render(p) {
                if (!p) {
                    document.getElementById('product-detail').innerHTML = '<div class="no-product"><h2>Không tìm thấy sản phẩm</h2><p><a href="shop.html" style="color:#27ae60">Quay lại cửa hàng</a></p></div>';
                    return;
                }
                const inWish = CELLVANY.isWishlisted(p.id);
                const stars = '★'.repeat(Math.round(p.rating)) + '☆'.repeat(5 - Math.round(p.rating));
                document.getElementById('breadcrumb-name').textContent = p.name;

                // Set động meta SEO theo từng sản phẩm
                const desc = p.metaDescription || (p.description || '').slice(0, 160);
                document.title = p.name + ' | Cellvany';
                const md = document.querySelector('meta[name="description"]');
                if (md) md.setAttribute('content', desc);
                document.querySelector('meta[name="keywords"]')?.setAttribute('content', p.category + ', ' + p.categoryEn + ', Cellvany, mỹ phẩm thuần chay');
                document.querySelector('link[rel="canonical"]')?.setAttribute('href', 'https://cellvany.id.vn/product.html?id=' + p.id);
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.setAttribute('content', p.name);
                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogDesc) ogDesc.setAttribute('content', desc);
                if (p.image) {
                    document.querySelector('meta[property="og:image"]')?.setAttribute('content', 'https://cellvany.id.vn/' + p.image);
                    document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', 'https://cellvany.id.vn/' + p.image);
                }
                document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', p.name);
                document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', desc);
                const bcJson = document.getElementById('breadcrumb-json');
                if (bcJson) {
                    bcJson.textContent = JSON.stringify({
                        "@context": "https://schema.org",
                        "@type": "BreadcrumbList",
                        "itemListElement": [
                            { "@type": "ListItem", "position": 1, "name": "Trang chủ", "item": "https://cellvany.id.vn/" },
                            { "@type": "ListItem", "position": 2, "name": "Cửa hàng", "item": "https://cellvany.id.vn/shop.html" },
                            { "@type": "ListItem", "position": 3, "name": p.name, "item": "https://cellvany.id.vn/product.html?id=" + p.id }
                        ]
                    });
                }

                document.getElementById('product-detail').innerHTML = `
          <div class="product-detail">
            <div class="product-image">${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="font-size:40px;display:none;position:absolute">🧴</span>` : '🧴'}</div>
            <div class="product-info">
              <div class="product-category">${p.category}${p.stage ? ' · ' + p.stage : ''}</div>
              <h1>${p.h1 || p.name}</h1>
              <div class="product-rating">${stars} <span>(${p.reviews} đánh giá · ${p.rating}/5)</span></div>
              <div class="product-price">${p.priceDisplay}</div>
              <p class="product-desc">${p.description}</p>
${p.h2 ? `<h2 style="font-size:20px;color:#27ae60;margin:15px 0">${p.blogUrl ? `<a href="${p.blogUrl}" style="color:inherit;text-decoration:none">${p.h2} →</a>` : p.h2}</h2>` : ``}
              <div class="product-actions">
                <button class="btn btn-primary" onclick="CELLVANY.handleAddToCart(${p.id}, this)">🛒 Thêm Vào Giỏ</button>
                <button class="btn btn-wishlist ${inWish ? 'active' : ''}" onclick="CELLVANY.handleWishlistClick(${p.id}, this)">${inWish ? '❤️' : '🤍'} Yêu Thích</button>
                <button class="btn btn-buy" onclick="CELLVANY.handleAddToCart(${p.id}, this);location.href='cart.html'">Mua Ngay</button>
              </div>
            </div>
          </div>
        `;
                const related = CELLVANY.products.filter(x => x.id !== p.id && (x.categoryEn === p.categoryEn || x.stageEn === p.stageEn)).slice(0, 4);
                if (related.length) {
                    document.getElementById('related-products').innerHTML = related.map(r => CELLVANY.productCardHTML(r)).join('');
                } else {
                    document.getElementById('related-products').innerHTML = '';
                }
            }
            async function init() {
                await CELLVANY.loadData();
                const params = new URLSearchParams(window.location.search);
                const id = parseInt(params.get('id'));
                const p = CELLVANY.products.find(x => x.id === id);
                render(p);
            }
            return { init, render };
        })();
        document.addEventListener('DOMContentLoaded', PRODUCT.init);
    </script>
</body>

</html>
