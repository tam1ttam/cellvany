<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description"
        content="Blog Cellvany chia sẻ kiến thức chăm sóc tóc rụng sau sinh, da mẹ bầu, chăm sóc bé sơ sinh từ chuyên gia và mẹ bỉm sữa.">
    <title>Sản Phẩm - CELLVANY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
        }

        header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            text-align: center;
        }

        .logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-bottom: -5px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #333;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-icons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .buy-now-btn {
            background: #229954;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .breadcrumb {
            background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%);
            padding: 40px 20px;
            text-align: center;
        }

        .breadcrumb h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .breadcrumb-nav {
            color: #999;
        }

        .breadcrumb-nav a {
            color: #27ae60;
            text-decoration: none;
        }

        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* Ảnh lớn ở trang chi tiết: scope riêng để KHÔNG ảnh hưởng
           tới ảnh thu nhỏ trong card "Sản phẩm tương tự" (đó là lý do
           chữ nhãn badge từng bị hiển thị siêu to ở phần liên quan) */
        .product-detail>.product-image {
            background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%);
            border-radius: 10px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .product-detail .product-info h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: justify;
        }

        .product-category {
            color: #27ae60;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-rating {
            color: #ffc107;
            margin-bottom: 15px;
        }

        .product-rating span {
            color: #999;
            font-size: 13px;
        }

        .product-price {
            font-size: 28px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .product-desc {
            color: #666;
            margin-bottom: 20px;
            text-align: justify;
            line-height: 1.8;
        }

        .product-ingredients {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .product-ingredients h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .product-ingredients p {
            color: #666;
            font-size: 14px;
            text-align: justify;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s, transform .15s;
        }

        .btn-primary {
            background: #333;
            color: white;
            flex: 1;
        }

        .btn-wishlist {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-wishlist.active {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        .btn-buy {
            background: #27ae60;
            color: white;
            flex: 1;
        }

        .no-product {
            text-align: center;
            padding: 80px 20px;
        }

        .related-title {
            font-size: 24px;
            margin: 60px 0 20px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
            }

            .related-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        footer {
            background: #1a1a1a;
            color: white;
            padding: 40px 20px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #999;
        }
    </style>
</head>

<body> <!-- Header injected by shared.js -->
    <section class="breadcrumb">
        <h1>Sản Phẩm</h1>
        <div class="breadcrumb-nav"> <a href="index.html">Trang Chủ</a> &gt; <a href="shop.html">Cửa Hàng</a> &gt; <span
                id="breadcrumb-name">Đang tải...</span> </div>
    </section>
    <div class="product-container">
        <div id="product-detail"></div>
        <h2 class="related-title">Sản Phẩm Tương Tự</h2>
        <div class="related-grid" id="related-products"></div>
    </div> <!-- Footer injected by shared.js -->
    <script src="asset/js/shared.js"></script>
    <script>
        const PRODUCT = (() => {
            function render(p) {
                if (!p) {
                    document.getElementById('product-detail').innerHTML = '<div class="no-product"><h2>Không tìm thấy sản phẩm</h2><p><a href="shop.html" style="color:#27ae60">Quay lại cửa hàng</a></p></div>';
                    return;
                }
                const inWish = CELLVANY.isWishlisted(p.id);
                const stars = '★'.repeat(Math.round(p.rating)) + '☆'.repeat(5 - Math.round(p.rating));
                document.getElementById('breadcrumb-name').textContent = p.name;
                document.getElementById('product-detail').innerHTML = `
          <div class="product-detail">
            <div class="product-image">${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="font-size:40px;display:none;position:absolute">🧴</span>` : '🧴'}</div>
            <div class="product-info">
              <div class="product-category">${p.category}${p.stage ? ' · ' + p.stage : ''}</div>
              <h1>${p.name}</h1>
              <div class="product-rating">${stars} <span>(${p.reviews} đánh giá · ${p.rating}/5)</span></div>
              <div class="product-price">${p.priceDisplay}</div>
              <p class="product-desc">${p.description}</p>
              <div class="product-ingredients">
                <h3>Thành Phần</h3>
                <p>${p.ingredients}</p>
              </div>
              <div class="product-actions">
                <button class="btn btn-primary" onclick="CELLVANY.handleAddToCart(${p.id}, this)">🛒 Thêm Vào Giỏ</button>
                <button class="btn btn-wishlist ${inWish ? 'active' : ''}" onclick="CELLVANY.handleWishlistClick(${p.id}, this)">${inWish ? '❤️' : '🤍'} Yêu Thích</button>
                <button class="btn btn-buy" onclick="CELLVANY.handleAddToCart(${p.id}, this);location.href='cart.html'">Mua Ngay</button>
              </div>
            </div>
          </div>
        `;
                const related = CELLVANY.products.filter(x => x.id !== p.id && (x.categoryEn === p.categoryEn || x.stageEn === p.stageEn)).slice(0, 4);
                if (related.length) {
                    document.getElementById('related-products').innerHTML = related.map(r => CELLVANY.productCardHTML(r)).join('');
                } else {
                    document.getElementById('related-products').innerHTML = '';
                }
            }
            async function init() {
                await CELLVANY.loadData();
                const params = new URLSearchParams(window.location.search);
                const id = parseInt(params.get('id'));
                const p = CELLVANY.products.find(x => x.id === id);
                render(p);
            }
            return { init, render };
        })();
        document.addEventListener('DOMContentLoaded', PRODUCT.init);
    </script>
</body>

</html>
