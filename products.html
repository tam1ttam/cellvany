    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
        }

        header {
            background: #fff;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo img {
            height: 60px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-bottom: -5px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: bold;
            color: #27ae60;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            transition: color .3s;
        }

        nav a:hover {
            color: #27ae60;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-icons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        .buy-now-btn {
            background: #229954;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }






        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Banner mua theo giai đoạn */
        .stage-banner {
            font-size: 26px;
            font-weight: bold;
            color: #27ae60;
            margin: 50px 0 30px;
            text-align: center;
            background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%);
            padding: 20px;
            border-radius: 10px;
        }

        .stage-section {
            margin-bottom: 60px;
        }

        .stage-header {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 5px solid #27ae60;
        }

        /* product-grid dùng cv-card từ shared.js */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        footer {
            background: #1a1a1a;
            color: white;
            padding: 40px 20px;
            margin-top: 60px;
        }

        @media (max-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .stage-banner {
                font-size: 18px;
            }

            .stage-header {
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            .products-container {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <link rel="icon" type="image/png" href="asset/logo.png">
</head>

<body>
    <!-- Header injected by shared.js -->

    <section class="breadcrumb">
        <h1>Phục Hồi Tóc Rụng Sau Sinh Bằng Thảo Mộc Thuần Chay – Đúng Từ Gốc</h1>
        <div class="breadcrumb-nav">
            <!-- <a href="index.html">Trang Chủ</a> &gt; Sản Phẩm -->
            Rụng Tóc Sau Sinh: Khi Nào Bình Thường, Khi Nào Cần Can Thiệp?
        </div>

    </section>

    <div class="container">
        <h2 class="stage-banner">MUA THEO GIAI ĐOẠN (KHUYÊN DÙNG)</h2>

        <!-- Các stage section sẽ được inject bởi JS -->
        <div id="products-by-stage"></div>
    </div>

    <!-- Footer injected by shared.js -->

    <script src="asset/js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const data = await CELLVANY.loadData();

            const stageOrder = [
                { id: 'pregnant', label: '🤰 CHĂM SÓC MẸ MANG BẦU' },
                { id: 'postpartum', label: '🍼 CHĂM SÓC MẸ BỈM SỮA' },
                { id: 'baby', label: '👶 CHĂM SÓC EM BÉ' },
            ];

            const container = document.getElementById('products-by-stage');

            stageOrder.forEach(stage => {
                const items = CELLVANY.products.filter(p => p.stageEn === stage.id);
                if (!items.length) return;

                const section = document.createElement('div');
                section.className = 'stage-section';
                section.innerHTML = `
          <h2 class="stage-header">${stage.label}</h2>
          <div class="product-grid">
            ${items.map(p => CELLVANY.productCardHTML(p)).join('')}
          </div>
        `;
                container.appendChild(section);
            });

            CELLVANY.updateAllBadges();
        });
    </script>
</body>

</html>
