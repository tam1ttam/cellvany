name: Deploy to VPS

on:
  push:
    branches: [ static ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/cellvany
            git pull origin static
            rsync -avz --delete \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='__MACOSX' \
              --exclude='*.py' \
              --exclude='*.md' \
              /root/cellvany/ /var/www/cellvany/
            chown -R www-data:www-data /var/www/cellvany
            nginx -t && systemctl reload nginx