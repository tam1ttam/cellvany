    .shop-container {
      max-width: 1200px;

      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 40px;

    .sidebar {

      padding: 20px;

      height: fit-content;

    }

    .sidebar-section {

    .sidebar-section h3 {

    }

    .sidebar-section input[type="text"] {

      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .filter-list {
      list-style: none;
    }

    .filter-list li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .filter-list input {
      margin-right: 8px;
      cursor: pointer;
    }

    .filter-list label {
      cursor: pointer;
      font-size: 14px;
    }

    .filter-list label:hover {
      color: #27ae60;
    }

    .active-filter {
      background: #27ae60;
      color: white;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

    .product-image {

      justify-content: center;
      position: relative;
      color: #999;

    .product-label {

      left: 10px;

  <!-- Shop Content -->
  <div class="shop-container">
    <!-- Sidebar Filters -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>Tìm Sản Phẩm</h3>
        <input type="text" id="shop-search" placeholder="Tìm kiếm sản phẩm..." oninput="SHOP.render()">
      </div>

      <div class="sidebar-section">
        <h3>Danh Mục</h3>
        <ul class="filter-list" id="category-filters"></ul>
      </div>



      <div class="sidebar-section">
        <h3>Giai Đoạn</h3>
        <ul class="filter-list" id="stage-filters"></ul>
      </div>

      <div class="sidebar-section">
        <h3>Sắp Xếp</h3>
        <select id="sort-select" onchange="SHOP.render()"
          style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px;font-size:14px">
          <option value="">Mặc định</option>
          <option value="price-asc">Giá: Thấp → Cao</option>
          <option value="price-desc">Giá: Cao → Thấp</option>
          <option value="rating">Đánh giá cao nhất</option>
          <option value="name">Tên A → Z</option>
        </select>
      </div>

    <!-- Products -->
    <section>
      <div class="shop-controls">
        <p class="result-count" id="result-count">Đang tải...</p>
      </div>

      <div class="pagination" id="shop-pagination"></div>
    </section>
  </div>

  <!-- Footer injected by shared.js -->

  <script src="asset/js/shared.js?v=20260718"></script>
  <script>
    const SHOP = (() => {
      const PER_PAGE = 9;
      let currentPage = 1;
      let filters = { query: '', category: '', stage: '', sort: '' };

      function getFiltersFromURL() {
        const params = new URLSearchParams(window.location.search);
        filters.query = params.get('search') || '';
        filters.category = params.get('category') || '';
        filters.stage = params.get('stage') || '';
        if (filters.query) document.getElementById('shop-search').value = filters.query;
      }

      function buildFilterHTML(items, selected, prefix) {
        return items.map(item => {
          const id = prefix + '-' + item.id;
          const checked = (selected === item.id || selected === item.name) ? ' checked' : '';
          return `<li><label><input type="radio" name="${prefix}" value="${item.id}"${checked} onchange="SHOP.setFilter('${prefix}', this.value)"> ${item.name}</label></li>`;
        }).join('');
      }

      function setFilter(type, value) {
        filters[type] = value;
        currentPage = 1;
        render();
      }

      function render() {
        filters.query = document.getElementById('shop-search')?.value || '';
        filters.sort = document.getElementById('sort-select')?.value || '';
        const filtered = CELLVANY.filterProducts(filters);
        const { items, page, total } = CELLVANY.paginate(filtered, currentPage, PER_PAGE);

        document.getElementById('result-count').textContent = `Hiển thị ${items.length} / ${filtered.length} sản phẩm`;
        CELLVANY.renderProductGrid('#shop-products', items);
        renderPagination(total, page);
      }

      function renderPagination(totalPages, current) {
        const container = document.getElementById('shop-pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '';
        html += `<button ${current === 1 ? 'disabled' : ''} onclick="SHOP.goPage(${current - 1})">← Prev</button>`;
        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i > 3 && i < totalPages - 1 && i !== current) {
            if (i === 4 || i === totalPages - 2) html += `<button disabled>...</button>`;
            continue;
          }
          html += `<button class="${i === current ? 'active' : ''}" onclick="SHOP.goPage(${i})">${i}</button>`;
        }
        html += `<button ${current === totalPages ? 'disabled' : ''} onclick="SHOP.goPage(${current + 1})">Next →</button>`;
        container.innerHTML = html;
      }

      function goPage(p) { currentPage = p; render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

      async function init() {
        await CELLVANY.loadData();
        getFiltersFromURL();
        const data = await CELLVANY.loadData();
        document.getElementById('category-filters').innerHTML =
          `<li><label><input type="radio" name="category" value="" ${!filters.category ? 'checked' : ''} onchange="SHOP.setFilter('category','')"> Tất cả</label></li>` +
          data.categories.map(c => `<li><label><input type="radio" name="category" value="${c.id}" ${filters.category === c.id ? 'checked' : ''} onchange="SHOP.setFilter('category','${c.id}')"> ${c.name}</label></li>`).join('');
        document.getElementById('stage-filters').innerHTML =
          `<li><label><input type="radio" name="stage" value="" ${!filters.stage ? 'checked' : ''} onchange="SHOP.setFilter('stage','')"> Tất cả</label></li>` +
          data.stages.map(s => `<li><label><input type="radio" name="stage" value="${s.id}" ${filters.stage === s.id ? 'checked' : ''} onchange="SHOP.setFilter('stage','${s.id}')"> ${s.icon} ${s.name}</label></li>`).join('');
        render();
      }

      return { init, setFilter, goPage, render };
    })();

    document.addEventListener('DOMContentLoaded', SHOP.init);
  </script>
