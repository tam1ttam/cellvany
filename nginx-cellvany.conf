server {
    listen 80;
    listen [::]:80;
    server_name cellvany.id.vn www.cellvany.id.vn;
    root /var/www/cellvany;
    index index.html;

    # Cho phép truy cập file HTML không cần gõ .html
    # /about → about.html, /products/x → products/x.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache tĩnh: ảnh, font, CSS, JS
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2|woff|ttf|eot|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # JSON data — cache ngắn vì có thể đổi
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Chặn file ẩn (.env, .git...)
    location ~ /\. {
        deny all;
        log_not_found off;
    }
}
