">Đang tải...</div> </div> <div class="related-posts cv-reveal" id="related-posts-container"> <h2>Bài Viết Liên Quan</h2> <div class="related-grid" id="related-grid"></div> </div> <!-- Footer injected by shared.js --> <script src="asset/js/shared.js"></script> <script> document.addEventListener('DOMContentLoaded', async () => { await CELLVANY.loadData(); const params = new URLSearchParams(window.location.search); const id = parseInt(params.get('id')); const post = CELLVANY.blogs.find(b => b.id === id); if (!post) { document.getElementById('blog-detail-container').innerHTML = '<div style="text-align:center;padding:60px"><h3>Không tìm thấy bài viết</h3><a href="blog.html" style="color:#27ae60">← Quay lại Blog</a></div>'; return; } const metaDesc = post.metaDescription || (post.content || '').replace(/<[^>]*>/g, '').slice(0, 160); document.title = post.title + ' - CELLVANY'; const mdEl = document.querySelector('meta[name="description"]'); if (mdEl) mdEl.setAttribute('content', metaDesc); document.getElementById('breadcrumb-title').textContent = post.title; const h1 = post.h1 || post.title; const h2s = [post.h2_1, post.h2_2, post.h2_3].filter(Boolean); let extraMeta = ''; if (post.author_name) { const initial = post.author_name.split(' ').pop().charAt(0); extraMeta += `<span>👤 <strong>${post.author_name}</strong>${post.author_credential ? ' – ' + post.author_credential : ''}</span>`; } else if (post.author) { extraMeta += `<span>👤 ${post.author}</span>`; } if (post.date) { extraMeta += `<span>📅 ${new Date(post.date).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>`; } if (post.category) { extraMeta += `<span>📂 ${post.category}</span>`; } let eeatHTML = ''; if (post.author_name && post.author_credential) { const initial = post.author_name.trim().split(' ').pop().charAt(0); eeatHTML = `<div class="eeat-author-box"> <div class="eeat-author-avatar">${initial}</div> <div class="eeat-author-info"> <strong>Tác giả: ${post.author_name}</strong><br> <span class="credential">${post.author_credential}</span> </div> </div>`; } let ymylHTML = ''; if (post.medical_disclaimer) { ymylHTML += `<div class="ymyl-disclaimer"><h4>⚠️ Lưu ý Y tế</h4><p>${post.medical_disclaimer}</p></div>`; } if (post.ymyl_reviewed_by) { ymylHTML += `<div class="ymyl-reviewed-by">✅ Bài viết được review bởi ${post.ymyl_reviewed_by}.</div>`; } if (post.ymyl_sources) { ymylHTML += `<div class="ymyl-reviewed-by" style="border-left-color:#ff9800;background:#fff8e1"><strong>📚 Nguồn tham khảo:</strong> ${post.ymyl_sources}</div>`; } const articleSchema = { "@context": "https://schema.org", "@type": "Article", "headline": post.title, "description": metaDesc, "author": { "@type": "Person", "name": post.author_name || post.author || 'Cellvany', "jobTitle": post.author_credential || '' }, "publisher": { "@type": "Organization", "name": "Cellvany", "logo": { "@type": "ImageObject", "url": "https://cellvany.vn/asset/images/cellvany-logo.webp" } }, "datePublished": post.date || new Date().toISOString().split('T')[0], "dateModified": post.date || new Date().toISOString().split('T')[0], "mainEntityOfPage": "https://cellvany.vn/blog_detail.html?id=" + post.id }; let schemaScript = document.getElementById('article-schema'); if (!schemaScript) { schemaScript = document.createElement('script'); schemaScript.type = 'application/ld+json'; schemaScript.id = 'article-schema'; document.head.appendChild(schemaScript); } schemaScript.textContent = JSON.stringify(articleSchema); document.getElementById('blog-detail-container').innerHTML = ` <div class="blog-detail-header cv-anim-up"> <h1>${h1}</h1> <div class="blog-detail-meta"> ${extraMeta} </div> </div> ${eeatHTML} <div class="blog-detail-image cv-reveal"> <img src="asset/img/${post.image}" alt="${post.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"> <span class="fallback">📝</span> </div> <div class="blog-detail-content cv-reveal"> ${ymylHTML} ${post.content} </div> <div class="blog-detail-tags cv-reveal"> ${(post.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')} </div> <div class="blog-detail-nav"> <a href="blog.html">← Quay lại Blog</a> <a href="shop.html">Mua Sắm Ngay →</a> </div> `; const related = CELLVANY.blogs.filter(b => b.id !== id && b.category === post.category).slice(0, 3); if (!related.length) { document.getElementById('related-posts-container').style.display = 'none'; return; } document.getElementById('related-grid').innerHTML = related.map(r => ` <a class="related-card" href="blog/${r.slug}.html"> <div class="related-image"> <img src="asset/img/${r.image}" alt="${r.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"> <span class="fallback">📝</span> </div> <h4>${r.title}</h4> <p>${new Date(r.date).toLocaleDateString('vi-VN')}</p> </a> `).join(''); }); </script> </body> </html>
