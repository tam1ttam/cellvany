<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Chi Tiết Bài Viết - CELLVANY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background: #fff; }
    header { background: #fff; padding: 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,.1); position: sticky; top: 0; z-index: 100; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
    .logo { display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
    .logo img { height: 60px; width: auto; object-fit: contain; display: block; margin-bottom: -5px; }
    .logo-text { font-size: 16px; font-weight: bold; color: #27ae60; }
    nav ul { list-style: none; display: flex; gap: 30px; }
    nav a { text-decoration: none; color: #333; }
    .header-icons { display: flex; gap: 20px; align-items: center; }
    .header-icons button { background: none; border: none; cursor: pointer; font-size: 16px; }
    .buy-now-btn { background: #229954; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; }
    .breadcrumb { background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%); padding: 40px 20px; text-align: center; }
    .breadcrumb-nav { color: #999; }
    .breadcrumb-nav a { color: #27ae60; text-decoration: none; }
    .blog-detail { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .blog-detail-header { margin-bottom: 30px; }
    .blog-detail-header h1 { font-size: 32px; margin-bottom: 15px; color: #333; text-align: justify; }
    .blog-detail-meta { font-size: 14px; color: #999; display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .blog-detail-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .blog-detail-image { background: linear-gradient(135deg, #d5f4e6 0%, #a9dfbf 100%); height: 350px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 60px; margin-bottom: 30px; }
    .blog-detail-content { font-size: 16px; line-height: 1.9; color: #444; }
    .blog-detail-content p { margin-bottom: 20px; text-align: justify; }
    .blog-detail-content h3 { font-size: 22px; margin: 30px 0 15px; color: #27ae60; }
    .blog-detail-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 30px; }
    .blog-detail-tags .tag { background: #f5f5f5; border: 1px solid #27ae60; color: #27ae60; padding: 5px 15px; border-radius: 20px; font-size: 13px; }
    .blog-detail-nav { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 30px; border-top: 1px solid #eee; }
    .blog-detail-nav a { color: #27ae60; text-decoration: none; font-weight: 600; }
    .blog-detail-nav a:hover { text-decoration: underline; }
    .related-posts { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
    .related-posts h2 { font-size: 28px; margin-bottom: 30px; color: #27ae60; text-align: center; }
    .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .related-card { background: #fafafa; border-radius: 8px; padding: 20px; cursor: pointer; transition: transform 0.3s; }
    .related-card:hover { transform: translateY(-5px); }
    .related-card h4 { font-size: 16px; margin-bottom: 10px; color: #333; text-align: justify; }
    .related-card p { font-size: 13px; color: #999; }
    footer { background: #1a1a1a; color: white; padding: 40px 20px; margin-top: 60px; text-align: center; }
    @media (max-width: 768px) {
      .related-grid { grid-template-columns: 1fr; }
      .blog-detail-header h1 { font-size: 24px; }
    }
    @media (max-width: 480px) {
      .blog-detail-header h1 { font-size: 20px; }
      .blog-detail-image { height: 200px; }
    }
  </style>
</head>
<body>
  <!-- Header injected by shared.js -->
  <section class="breadcrumb">
    <div class="breadcrumb-nav">
      <a href="index.html">Trang Chủ</a> &gt; <a href="blog.html">Blog</a> &gt; <span id="breadcrumb-title">Chi Tiết</span>
    </div>
  </section>

  <div class="blog-detail" id="blog-detail-container">
    <div style="text-align:center;padding:60px;color:#999">Đang tải...</div>
  </div>

  <div class="related-posts" id="related-posts-container">
    <h2>Bài Viết Liên Quan</h2>
    <div class="related-grid" id="related-grid"></div>
  </div>

  <!-- Footer injected by shared.js -->
  <script src="asset/js/shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await CELLVANY.loadData();
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      const post = CELLVANY.blogs.find(b => b.id === id);

      if (!post) {
        document.getElementById('blog-detail-container').innerHTML =
          '<div style="text-align:center;padding:60px"><h3>Không tìm thấy bài viết</h3><a href="blog.html" style="color:#27ae60">← Quay lại Blog</a></div>';
        return;
      }

      document.getElementById('breadcrumb-title').textContent = post.title;
      document.getElementById('blog-detail-container').innerHTML = `
        <div class="blog-detail-header">
          <h1>${post.title}</h1>
          <div class="blog-detail-meta">
            <span>👤 ${post.author}</span>
            <span>📅 ${new Date(post.date).toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
            <span>📂 ${post.category}</span>
          </div>
        </div>
        <div class="blog-detail-image"><img src="asset/img/${post.image}" alt="${post.title}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" onerror="this.style.display='none';this.parentElement.innerHTML+='<span style=position:absolute;font-size:60px>📝</span>'"></div>
        <div class="blog-detail-content">${post.content}</div>
        <div class="blog-detail-tags">
          ${(post.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
        </div>
        <div class="blog-detail-nav">
          <a href="blog.html">← Quay lại Blog</a>
          <a href="shop.html">Mua Sắm Ngay →</a>
        </div>
      `;

      const related = CELLVANY.blogs.filter(b => b.id !== id && b.category === post.category).slice(0, 3);
      if (!related.length) {
        document.getElementById('related-posts-container').style.display = 'none';
        return;
      }
      document.getElementById('related-grid').innerHTML = related.map(r => `
        <div class="related-card" onclick="location.href='blog_detail.html?id=${r.id}'">
          <div class="blog-detail-image" style="height:150px;font-size:30px;margin-bottom:15px"><img src="asset/img/${r.image}" alt="${r.title}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" onerror="this.style.display='none';this.parentElement.innerHTML+='<span style=position:absolute;font-size:30px>📝</span>'"></div>
          <h4>${r.title}</h4>
          <p>${new Date(r.date).toLocaleDateString('vi-VN')}</p>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
